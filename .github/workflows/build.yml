name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate resources (runData)
        run: |
          chmod +x gradlew
          ./gradlew runData --no-configuration-cache --stacktrace

      - name: Build jar
        run: ./gradlew build --no-configuration-cache --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aerocables-powergrid-jar
          path: build/libs/*.jar

      - name: Check jar contents
        run: |
          for j in build/libs/*.jar; do echo "== $j"; unzip -l "$j" | grep -i -E "powergrid|pg_" ; done

      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Automatic build from the latest commit on main.
            Put the jar without "-sources" into your mods folder instead of the original Create: Aero Cables.
          files: build/libs/*.jar
