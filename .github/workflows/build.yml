name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate resources (runData)
        run: |
          chmod +x gradlew
          ./gradlew runData --no-configuration-cache --stacktrace

      - name: Build jar
        run: ./gradlew build --no-configuration-cache --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aerocables-powergrid-jar
          path: build/libs/*.jar
